name: Nightly database backup

# Encrypted pg_dump of the production database, kept 30 days as a workflow artifact.
# Artifacts on a public repo are downloadable by any GitHub user, so the dump is
# encrypted (AES-256, PBKDF2) with BACKUP_PASSPHRASE before upload. Restore steps:
# scripts/restore-backup.sh. Needs repo secrets BACKUP_DATABASE_URL and BACKUP_PASSPHRASE.

on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::BACKUP_DATABASE_URL and BACKUP_PASSPHRASE secrets are required"; exit 1
          fi

      - name: Dump (pg_dump 17, matching the server)
        run: |
          docker run --rm -e PGCONNECT_TIMEOUT=30 postgres:17 \
            pg_dump --format=custom --no-owner --no-privileges --schema=public "$DATABASE_URL" > db.dump
          test -s db.dump
          ls -lh db.dump

      - name: Encrypt
        run: |
          STAMP=$(date -u +%Y-%m-%dT%H%MZ)
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in db.dump -out "clarity60-$STAMP.dump.enc" -pass env:BACKUP_PASSPHRASE
          shred -u db.dump
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clarity60-db-${{ env.STAMP }}
          path: clarity60-*.dump.enc
          retention-days: 30
          if-no-files-found: error
