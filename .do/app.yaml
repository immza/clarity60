# DigitalOcean App Platform spec for clarity60.com.
# Secrets are NOT stored here: values marked "set in dashboard" are entered once in
# App → Settings → Environment Variables (encrypted by DigitalOcean).
name: clarity60
region: sfo          # next to the Supabase database (West US, Oregon)

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

services:
  - name: web
    github:
      repo: immza/clarity60
      branch: main
      deploy_on_push: true     # every merge to main deploys (CI must pass first)
    environment_slug: node-js
    build_command: npm run build
    run_command: npm start
    http_port: 3000
    instance_size_slug: apps-s-1vcpu-1gb-fixed   # $10/mo flat, 1 container; apps-s-1vcpu-1gb ($12) allows scaling out
    instance_count: 1
    health_check:
      http_path: /healthz
      initial_delay_seconds: 20
      period_seconds: 15
      timeout_seconds: 5
      failure_threshold: 4
    alerts:
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 85
        window: TEN_MINUTES
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 3
        window: ONE_HOUR
    envs:
      - { key: NODE_ENV, value: production, scope: RUN_TIME }  # run time only: at build time it makes npm skip devDependencies (TypeScript)
      - { key: NEXT_PUBLIC_SITE_URL, value: https://clarity60.com, scope: RUN_AND_BUILD_TIME }
      - { key: NEXT_PUBLIC_SENTRY_DSN, value: "https://1859897559c199bc447015b4ffbd9c7b@o4512316679520256.ingest.us.sentry.io/4512316688433152", scope: RUN_AND_BUILD_TIME }
      - { key: S3_REGION, value: us-west-2, scope: RUN_AND_BUILD_TIME }
      - { key: S3_BUCKET, value: media, scope: RUN_AND_BUILD_TIME }
      - { key: RATE_LIMIT_IP_HEADER, value: do-connecting-ip, scope: RUN_TIME }  # set by DigitalOcean, not spoofable
      # --- set in dashboard (type SECRET) ---
      - { key: DATABASE_URL, scope: RUN_AND_BUILD_TIME, type: SECRET }        # Supabase session pooler, port 5432
      - { key: PAYLOAD_SECRET, scope: RUN_AND_BUILD_TIME, type: SECRET }      # 64 random hex chars
      - { key: S3_ENDPOINT, scope: RUN_AND_BUILD_TIME, type: SECRET }         # https://<ref>.storage.supabase.co/storage/v1/s3
      - { key: S3_ACCESS_KEY_ID, scope: RUN_AND_BUILD_TIME, type: SECRET }
      - { key: S3_SECRET_ACCESS_KEY, scope: RUN_AND_BUILD_TIME, type: SECRET }
      - { key: IMAGEKIT_URL_ENDPOINT, scope: RUN_AND_BUILD_TIME, type: SECRET }
      - { key: DATABASE_CA_CERT, scope: RUN_AND_BUILD_TIME, type: SECRET }    # required: Supabase CA certificate (PEM) for verified TLS
      - { key: SENTRY_AUTH_TOKEN, scope: BUILD_TIME, type: SECRET }           # optional: readable stack traces
      - { key: INDEXNOW_KEY, scope: RUN_TIME, type: SECRET }                  # optional
      - { key: NEXT_PUBLIC_GA_ID, scope: RUN_AND_BUILD_TIME }                  # optional, when GA4 is ready

# No custom domains here: Cloudflare proxies clarity60.com to the app's default
# <app>.ondigitalocean.app hostname. Adding the domain to App Platform while Cloudflare
# proxies it breaks certificate renewal (DigitalOcean docs, "Configure an external CDN").
# Fallback if the proxied setup fails on launch day: see docs/LAUNCH.md §4.
